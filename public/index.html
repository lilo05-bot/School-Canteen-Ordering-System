<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celtech Canteen</title>
    <link rel="stylesheet" href="/src/styles.css" />

  </head>
  <body>

    <div id="root">
      <header class="site-header">
        <div class="header-inner">
          <div class="brand">
            <img id="school-logo" alt="Celtech school logo" />
            <div>
              <p class="school-name">Central Luzon College of Science and Technology</p>
              <h1>CELTECH CANTEEN</h1>
              <p class="tagline">Order Easy, Eat Happy</p>
            </div>
          </div>
          <div class="account-area">
            <span id="account"></span>
            <button id="logout" data-action="logout" hidden>Log out</button>
          </div>
        </div>
      </header>
      <main class="container">
        <div id="alerts"></div>
        <nav id="navigation" class="navigation" aria-label="Main navigation" hidden></nav>
        <div id="pickup-notice" role="status" aria-live="polite"></div>
        <div id="content"></div>
        <noscript>This ordering system needs JavaScript enabled to connect to the PHP server.</noscript>
        <footer>Connected to the PHP server · Orders refresh every 5 seconds.<br />Pickup notices appear inside the system. Cash is collected at the counter.</footer>
      </main>
      <dialog id="receipt" class="receipt" aria-labelledby="receipt-heading">
        <div id="receipt-content"></div>
        <div class="receipt-actions">
          <button class="primary" data-action="print">Print / Save PDF</button>
          <button class="outline" data-action="close-receipt" autofocus>Close</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/app.js"></script>

  </body>
</html>
